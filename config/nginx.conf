# NGINX Configuration for Low-Resource Deployment
# Optimized for: 2-core CPU, 4GB RAM, 1000 concurrent users
# Demonstrates: Event-driven workers, rate limiting, caching

# Worker process configuration (Question 8 optimization)
worker_processes 2;  # One per CPU core
worker_rlimit_nofile 65535;

events {
    worker_connections 10000;  # 10K connections per worker = 20K total
    use epoll;  # Linux: efficient I/O multiplexing (Q8 proposal)
    multi_accept on;  # Accept multiple connections at once
}

http {
    # Basic settings
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # MIME types
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript;

    # Rate limiting (Q8 bottleneck: queue contention)
    # Shared memory zone for tracking request counts
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=burst_limit:10m rate=100r/s;

    # Proxy cache (reduces backend load)
    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=api_cache:10m max_size=100m inactive=60m;

    # Upstream Node.js cluster (load balancing)
    upstream nodejs_cluster {
        least_conn;  # Route to worker with least connections
        server localhost:3001;
        server localhost:3001;
        keepalive 32;  # Connection pool to backend
    }

    # Server block
    server {
        listen 80;
        server_name localhost;

        # Root endpoint
        location / {
            return 200 '{"message":"NGINX Reverse Proxy","architecture":"Event-driven workers","workers":2,"optimization":"epoll + rate limiting + caching"}';
            add_header Content-Type application/json;
        }

        # API endpoint with rate limiting and caching
        location /api/ {
            # Rate limiting with burst allowance (from reading materials)
            limit_req zone=api_limit burst=5 nodelay;
            
            # Caching
            proxy_cache api_cache;
            proxy_cache_valid 200 60s;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            add_header X-Cache-Status $upstream_cache_status;

            # Proxy to Node.js cluster
            proxy_pass http://nodejs_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # Response headers
            add_header X-Served-By nginx;
            add_header X-Worker-PID $pid;
        }

        # High-throughput endpoint (burst rate limit)
        location /api/burst {
            limit_req zone=burst_limit burst=20 nodelay;
            proxy_pass http://nodejs_cluster;
        }

        # Health check endpoint (no rate limit)
        location /health {
            access_log off;
            return 200 '{"status":"healthy","workers":2,"connections":"$connections_active"}';
            add_header Content-Type application/json;
        }
    }
}
